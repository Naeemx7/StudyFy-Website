<nav class="sticky top-0 z-50 w-full bg-white border-b border-gray-200">
  <div class="px-6 h-16 flex items-center justify-between max-w-[1600px] mx-auto">
    
    <!-- Left: Branding -->
    <div class="flex items-center gap-8">
      <a routerLink="/dashboard" class="flex items-center gap-2 font-bold text-xl text-gray-900">
        <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span>StudyAI</span>
      </a>

      <!-- Navigation Links -->
      <div class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a routerLink="/dashboard" 
           routerLinkActive="bg-gray-100 text-gray-900" 
           class="px-3 py-2 rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all duration-300 ease-in-out">
          Dashboard
        </a>
        <a routerLink="/analytics" 
           routerLinkActive="bg-gray-100 text-gray-900" 
           class="px-3 py-2 rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all duration-300 ease-in-out">
          Analytics
        </a>
      </div>
    </div>

    <!-- Right: User Profile & Actions -->
    <div class="flex items-center gap-3">
      
      <!-- Notification Bell -->
      <button class="text-gray-500 hover:text-gray-900 p-2 rounded-full hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
      </button>

      <!-- Streak (hardcoded for now) -->
      <div class="hidden md:flex items-center gap-1.5 px-3 py-1.5 bg-orange-50 rounded-full border border-orange-100">
        <span class="text-orange-500 text-sm">🔥</span>
        <span class="text-xs font-bold text-orange-700">0</span>
      </div>

      <!-- User Dropdown -->
      @if (currentUser$ | async; as user) {
      <div class="relative ml-2">
        <button (click)="toggleDropdown(); $event.stopPropagation()" class="flex items-center gap-2 hover:bg-gray-100 rounded-full p-1 pr-3 transition-colors">
          <div class="h-8 w-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-medium text-white shadow-sm ring-2 ring-white">
            {{ getInitials(user.userName) }}
          </div>
          <span class="text-sm font-medium text-gray-700 hidden md:block">{{ user.userName }}</span>
          <svg class="w-4 h-4 text-gray-400 transition-transform duration-200" [class.rotate-180]="isDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <!-- Dropdown Menu -->
        @if (isDropdownOpen) {
        <div class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] border border-gray-100 py-1 z-50 animate-in fade-in zoom-in-95 duration-200 origin-top-right">
          <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50 rounded-t-xl">
            <p class="text-sm font-semibold text-gray-900">{{ user.userName }}</p>
            <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
          </div>
          
          <div class="p-1">
            <a routerLink="/profile" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg> Profile
            </a>
            <a routerLink="/settings" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Settings
            </a>
          </div>

          <div class="border-t border-gray-100 p-1">
            <button (click)="logout()" class="flex w-full items-center gap-2 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors">
               <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg> Sign out
            </button>
          </div>
        </div>
        }
      </div>
      }
    </div>
  </div>
</nav>
