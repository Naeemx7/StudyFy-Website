<div class="min-h-screen bg-black text-white flex items-center justify-center p-4">
  <div class="w-full max-w-md space-y-8 bg-zinc-950 p-8 rounded-xl border border-zinc-800">
    
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold tracking-tight">Welcome Back</h2>
      <p class="mt-2 text-sm text-zinc-400">Sign in to continue your learning journey</p>
    </div>

    <!-- Google Button (disabled for now - Phase 2) -->
    <button disabled class="w-full flex items-center justify-center gap-2 bg-zinc-900 border border-zinc-700 text-zinc-500 rounded-lg py-2.5 cursor-not-allowed opacity-50">
        <svg class="h-5 w-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
          </svg>
      Google (Coming Soon)
    </button>

    <div class="relative">
      <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-zinc-800"></span></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-zinc-950 px-2 text-zinc-500">Or</span></div>
    </div>

    <!-- Registration Success Message (shown after redirect from signup) -->
    <div *ngIf="registrationMessage" class="p-3 bg-green-900/30 border border-green-700 rounded-lg text-sm text-green-400">
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>{{ registrationMessage }}</span>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="p-3 bg-red-900/30 border border-red-700 rounded-lg text-sm text-red-400">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Username Field -->
      <div class="space-y-2">
        <label class="text-sm font-medium" for="userName">Username</label>
        <input formControlName="userName" type="text" id="userName" placeholder="Your username"
          class="flex h-10 w-full rounded-md border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-600">
        <p *ngIf="hasError('userName')" class="text-xs text-red-400">
          Username is required.
        </p>
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium" for="password">Password</label>
          <!-- Forgot password link - disabled for now (Phase 2) -->
          <span class="text-sm text-zinc-600 cursor-not-allowed">Forgot password?</span>
        </div>
        <input formControlName="password" type="password" id="password" placeholder="••••••••"
          class="flex h-10 w-full rounded-md border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-600">
        <p *ngIf="hasError('password')" class="text-xs text-red-400">
          Password is required (min 6 characters).
        </p>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loading"
        class="w-full bg-white text-black hover:bg-zinc-200 font-bold py-2.5 rounded-lg transition-colors disabled:opacity-60">
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <div class="text-center text-sm text-zinc-400">
        Don't have an account? 
        <a routerLink="/signup" class="font-bold text-white hover:underline">Sign up</a>
    </div>
  </div>
</div>
