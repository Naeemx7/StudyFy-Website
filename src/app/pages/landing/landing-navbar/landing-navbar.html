<header class="bg-[#f8fafa] sticky top-0 z-50 border-b border-[#e5e7eb]/60">
  <div class="mx-auto max-w-[1200px] px-6 lg:px-10">
    <div class="h-[68px] flex items-center justify-between">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <img src="assets/settings/logo-cropped.png" alt="Studyfy" class="w-[38px] h-[38px] object-contain">
        <span class="text-[20px] font-bold text-[#2d3435] tracking-tight">Studyfy</span>
      </a>

      <!-- Center Nav -->
      <nav class="hidden md:flex items-center gap-8">
        <a href="#" class="text-[15px] font-semibold text-[#4f46e5] hover:opacity-80 transition">Home</a>
        <a href="#features" class="text-[15px] font-medium text-[#596061] hover:text-[#2d3435] transition">Features</a>
      </nav>

      <!-- CTA -->
      <div class="hidden md:flex items-center gap-3">
        <a routerLink="/login" class="text-[15px] font-medium text-[#596061] hover:text-[#2d3435] transition px-2">Login</a>
        <a routerLink="/signup"
           class="inline-flex items-center gap-2 bg-[#4f46e5] hover:bg-[#3d34d3] text-white text-[15px] font-bold px-6 py-[10px] rounded-full transition">
          Get Started
        </a>
      </div>

      <!-- Mobile menu button -->
      <button (click)="toggleMenu()" class="md:hidden p-2 text-[#596061]">
        @if (!isMenuOpen()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        }
      </button>
    </div>

    <!-- Mobile menu -->
    @if (isMenuOpen()) {
      <div class="md:hidden border-t border-[#e5e7eb] py-4 flex flex-col gap-3">
        <a href="#" (click)="closeMenu()" class="text-[15px] font-semibold text-[#4f46e5] px-2 py-1">Home</a>
        <a href="#features" (click)="closeMenu()" class="text-[15px] font-medium text-[#596061] px-2 py-1">Features</a>
        <a routerLink="/login" (click)="closeMenu()" class="text-[15px] font-medium text-[#596061] px-2 py-1">Login</a>
        <a routerLink="/signup" class="mt-2 bg-[#4f46e5] text-white text-[15px] font-bold px-6 py-3 rounded-full text-center">Get Started</a>
      </div>
    }
  </div>
</header>
